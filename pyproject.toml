[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nomincs-compress_jd261"
version = "0.1.0"
description = "从输入中抽取数值，计算模型压缩工程师·回归集与线上样本的差分相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nomincs" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nomincs.github.io"
Repository = "https://github.com/nomincs/compress_jd261"
Issues = "https://github.com/nomincs/compress_jd261/issues"

[project.scripts]
compress_jd261 = "compress_jd261:main"

[tool.setuptools]
py-modules = ["compress_jd261"]
